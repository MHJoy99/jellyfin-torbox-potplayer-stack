services:
  # ============================================================================
  # Jellyfin Media Server with NVIDIA Hardware Acceleration
  # ============================================================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
      - JELLYFIN_PublishedServerUrl=https://${DOMAIN_NAME:-localhost}
    ports:
      - "${JELLYFIN_HTTP_PORT:-8096}:8096"
      - "${JELLYFIN_HTTPS_PORT:-8920}:8920"
    volumes:
      # Jellyfin App Configuration & Metadata
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      # Host Cloud / Local Media Mounts (e.g. G: drive or mounted rclone virtual drive)
      - ${HOST_MEDIA_ROOT:-G:/}:/media:ro
      # Auto-mounting Host Rclone VFS Cache directly for high-performance read-ahead
      - ${HOST_RCLONE_VFS_CACHE:-C:/Users/Administrator/.cache/rclone/vfs}:/rclone-vfs-cache:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
    networks:
      - mediaserver_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # FlareSolverr - Cloudflare Challenge Bypass Proxy for Indexers & Scrapers
  # ============================================================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    networks:
      - mediaserver_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Caddy Reverse Proxy - Automatic Let's Encrypt TLS & WebSocket Multiplexing
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp" # HTTP/3 QUIC support
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jellyfin
      - flaresolverr
    networks:
      - mediaserver_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # Watchtower - Automated Container Image Updates & Health Maintenance
  # ============================================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-86400}
      - WATCHTOWER_INCLUDE_STOPPED=${WATCHTOWER_INCLUDE_STOPPED:-false}
      - WATCHTOWER_REVIVE_STOPPED=${WATCHTOWER_REVIVE_STOPPED:-false}
      - WATCHTOWER_NOTIFICATIONS_LEVEL=info
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mediaserver_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  jellyfin_config:
    name: jellyfin_config
    driver: local
  jellyfin_cache:
    name: jellyfin_cache
    driver: local
  caddy_data:
    name: caddy_data
    driver: local
  caddy_config:
    name: caddy_config
    driver: local

# ==============================================================================
# Custom Network Bridge
# ==============================================================================
networks:
  mediaserver_net:
    name: mediaserver_net
    driver: bridge
