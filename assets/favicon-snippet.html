<!-- right after the <meta name="theme-color" ...> line. -->

<!-- PNG fallbacks below are OPTIONAL and LOCAL-ONLY: export assets/favicon.svg -->

<link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png">
