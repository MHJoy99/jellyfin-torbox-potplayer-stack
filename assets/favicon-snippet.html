<!-- Copy-paste favicon block for the web control panel. -->
<!-- WHERE TO PASTE: control-panel/index.html, inside <head>, -->
<!-- right after the <meta name="theme-color" ...> line. -->
<!-- STEP 1: copy assets/favicon.svg to control-panel/favicon.svg (same folder as index.html). -->
<!-- STEP 2: replace the existing inline data-URI <link rel="icon" ...> line with this block. -->
<!-- STEP 3: reload http://127.0.0.1:18080 and check the tab icon at 16px and 32px. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#070b12">
