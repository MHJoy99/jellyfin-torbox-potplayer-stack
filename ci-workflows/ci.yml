name: CI Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.ps1'
      - '**/*.py'
      - '**/*.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.ps1'
      - '**/*.py'
      - '**/*.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-lint:
    name: PowerShell Static Analysis (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Host "Installing / Updating PSScriptAnalyzer..."
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop

          Write-Host "Scanning repository for PowerShell scripts..."
          $scripts = Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1, *.psd1 | Where-Object { $_.FullName -notmatch '\\(\.git|\.playwright-mcp)\\' }

          if (-not $scripts) {
            Write-Host "No PowerShell script files found."
            exit 0
          }

          Write-Host "Found $($scripts.Count) PowerShell file(s) to analyze."
          $hasErrors = $false
          $results = @()

          foreach ($file in $scripts) {
            Write-Host "Analyzing: $($file.FullName)"
            $res = Invoke-ScriptAnalyzer -Path $file.FullName -Severity Warning, Error -Recurse:$false
            if ($res) {
              $results += $res
              $res | ForEach-Object {
                $severity = $_.Severity.ToString().ToUpper()
                Write-Host "::[$severity] file=$($_.ScriptPath),line=$($_.Line),col=$($_.Column)::[$($_.RuleName)] $($_.Message)"
                if ($_.Severity -eq 'Error') {
                  $hasErrors = $true
                }
              }
            }
          }

          if ($results.Count -gt 0) {
            Write-Host "=== PSScriptAnalyzer Summary ==="
            $results | Format-Table -Property ScriptName, Line, Severity, RuleName, Message -AutoSize
          }

          if ($hasErrors) {
            Write-Error "PSScriptAnalyzer detected critical syntax or rule errors."
            exit 1
          } else {
            Write-Host "PowerShell analysis passed successfully."
          }

  python-lint:
    name: Python MCP Server Linting & Type Checks (Ruff & Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff Linter & Formatter Check
        run: |
          echo "Running Ruff checks..."
          ruff check . --output-format=github
          echo "Running Ruff format verification..."
          ruff format --check .

      - name: Run Flake8
        run: |
          echo "Running Flake8 syntax and style checks..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,.playwright-mcp
          flake8 . --count --max-complexity=15 --max-line-length=120 --statistics --exclude=.git,__pycache__,.playwright-mcp

  json-validation:
    name: JSON Schema & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate JSON Files
        run: |
          python -c "
          import json, glob, sys, os

          failed = False
          json_files = [f for f in glob.glob('**/*.json', recursive=True) if not f.startswith('.git/') and not f.startswith('.playwright-mcp/')]

          if not json_files:
              print('No JSON files found to validate.')
              sys.exit(0)

          print(f'Validating {len(json_files)} JSON file(s)...')
          for path in json_files:
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      json.load(f)
                  print(f'OK: {path}')
              except Exception as e:
                  print(f'ERROR in {path}: {e}', file=sys.stderr)
                  failed = True

          if failed:
              sys.exit(1)
          print('All JSON files are valid syntax.')
          "
