name: Documentation & Markdown Linting

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.md'
      - '.github/workflows/docs-lint.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.md'
      - '.github/workflows/docs-lint.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Linting (markdownlint-cli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          echo "Linting Markdown files..."
          markdownlint '**/*.md' --ignore node_modules --ignore .git --ignore .playwright-mcp --disable MD013 MD033 MD041 || true
          echo "Running strict check on docs/ directory..."
          markdownlint 'docs/**/*.md' 'playbooks/**/*.md' 'README.md' --disable MD013 MD033 --ignore node_modules

  link-check:
    name: Markdown File Reference Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Documentation Structure
        run: |
          python3 -c "
          import glob, os, sys

          md_files = glob.glob('**/*.md', recursive=True)
          print(f'Checking integrity of {len(md_files)} markdown files...')
          for f in md_files:
              if f.startswith('.git') or f.startswith('.playwright-mcp'):
                  continue
              if os.path.getsize(f) == 0:
                  print(f'Warning: Empty markdown file: {f}', file=sys.stderr)
              else:
                  print(f'Valid markdown structure: {f}')
          "
