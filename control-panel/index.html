<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Jellyfin Control Panel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1522'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%234f8cff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%237aa8ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="6.5"></circle>
            <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"></circle>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Jellyfin Control Panel</h1>
          <p class="brand-sub">Local media stack &middot; localhost only</p>
        </div>
      </div>

      <div class="topbar-status">
        <span id="stack-chip" class="stack-chip is-loading" role="status" aria-live="polite">
          <span class="stack-chip-dot" aria-hidden="true"></span>
          <span id="stack-chip-label">Checking&hellip;</span>
        </span>
        <span class="checked-indicator" id="last-checked" title="Last successful status poll">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 3"></path>
          </svg>
          <span id="last-checked-text">&mdash;</span>
        </span>
        <button class="icon-btn" id="refresh-button" type="button" aria-label="Refresh status now" title="Refresh now">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
        </button>
      </div>

      <div class="global-actions" role="group" aria-label="Stack actions">
        <button class="btn btn-primary" data-action="start" data-service="all" type="button">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          Start all
        </button>
        <button class="btn btn-secondary" data-action="restart" data-service="all" type="button">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
          Restart all
        </button>
        <button class="btn btn-secondary" data-action="sync" data-service="torbox-sync" type="button">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.7-4L4 9"></path><path d="M4 4v5h5"></path><path d="M4 13a8 8 0 0 0 14.7 4L20 15"></path><path d="M20 20v-5h-5"></path></svg>
          Sync TorBox
        </button>
        <button class="btn btn-danger" data-action="stop" data-service="all" type="button">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
          Stop all
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <div class="columns">
      <section class="services-pane" aria-label="Services">
        <div class="pane-heading">
          <h2>Services</h2>
          <span class="pane-hint">Health checks run against the real local endpoints</span>
        </div>
        <div id="services" class="service-grid" aria-live="polite" aria-busy="false"></div>

        <section class="playback-pane" aria-label="Playback readiness">
          <div class="pane-heading">
            <h2>Playback</h2>
            <span class="pane-hint">Latest reliable playlist</span>
          </div>
          <div id="playback-status" aria-live="polite"></div>
        </section>
      </section>

      <aside class="activity-pane" aria-label="Recent activity">
        <div class="pane-heading">
          <h2>Activity</h2>
          <span class="pane-hint">Auto-refreshes</span>
        </div>
        <ol id="activity-log" class="activity-log" aria-live="polite"></ol>
      </aside>
    </div>

    <footer class="footer-bar">
      <span class="footer-note">The panel only acts when you press a button &middot; bound to 127.0.0.1:18080</span>
      <a class="btn btn-ghost" id="open-jellyfin" href="http://127.0.0.1:8096/" target="_blank" rel="noopener">
        Open Jellyfin
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4L10 14"></path><path d="M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"></path></svg>
      </a>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
