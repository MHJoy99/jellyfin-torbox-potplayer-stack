name: Secret Scan
"on":
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches:
      - main
    paths:
      - '**.ps1'
      - '**.py'
      - '**.js'
      - '**.md'
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**.ps1'
      - '**.py'
      - '**.js'
      - '**.md'
      - '**.yml'
      - '**.yaml'
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  gitleaks:
    name: Gitleaks
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: pwsh
        run: |
          # gitleaks-action@v2 builds a bad Windows asset URL (v8.24.3 ..._windows_x64.tar.gz -> 404;
          # Windows assets are .zip). Install via Chocolatey instead (2026-09-05).
          $ErrorActionPreference = 'Stop'
          choco install gitleaks -y --no-progress
          gitleaks version
      - name: Run Gitleaks scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gitleaks detect --source . --no-git --redact --exit-code 1 -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write job summary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          'Gitleaks summary' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| Job | Result |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| --- | --- |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| gitleaks | pass |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          'Gitleaks scan completed with fetch-depth 0' | Out-File -FilePath gitleaks.log -Encoding utf8
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-logs
          path: gitleaks.log
          retention-days: 7
          if-no-files-found: warn
  pattern-scan:
    name: Pattern Scan (No Secrets)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run test-no-secrets scanner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tests/test-no-secrets.ps1
        id: pattern_scan
      - name: Write job summary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          'Pattern Scan summary' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| Job | Result |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| --- | --- |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| pattern-scan | pass |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          'Pattern scan (test-no-secrets.ps1) passed with placeholder allowlist' | Out-File -FilePath pattern-scan.log -Encoding utf8
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-scan-logs
          path: pattern-scan.log
          retention-days: 7
          if-no-files-found: warn
  status:
    name: STATUS
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
    needs:
      - gitleaks
      - pattern-scan
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show repository status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Repo: ${{ github.server_url }}/${{ github.repository }}'
          Write-Host 'Branch: ${{ github.ref_name }}'
          Write-Host 'Ref: ${{ github.ref }}'
          Write-Host 'SHA: ${{ github.sha }}'
          Write-Host 'Actor: ${{ github.actor }}'
          Write-Host 'Event: ${{ github.event_name }}'
      - name: Write summary table
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          'Secret Scan STATUS summary' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| Job | Result |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| --- | --- |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ('| gitleaks | ${{ needs.gitleaks.result }} |') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ('| pattern-scan | ${{ needs.pattern-scan.result }} |') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ('| Repo | ${{ github.server_url }}/${{ github.repository }} |') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ('| Branch | ${{ github.ref_name }} |') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: status-logs
          path: '*.log'
          retention-days: 7
          if-no-files-found: warn
