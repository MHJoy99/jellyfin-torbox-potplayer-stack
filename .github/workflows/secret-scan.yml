name: Secret Scan
"on":
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches:
      - main
    paths:
      - '**.ps1'
      - '**.py'
      - '**.js'
      - '**.md'
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**.ps1'
      - '**.py'
      - '**.js'
      - '**.md'
      - '**.yml'
      - '**.yaml'
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  gitleaks:
    name: Gitleaks
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write job summary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          'Gitleaks summary' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| Job | Result |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| --- | --- |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| gitleaks | pass |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          'Gitleaks scan completed with fetch-depth 0' | Out-File -FilePath gitleaks.log -Encoding utf8
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-logs
          path: gitleaks.log
          retention-days: 7
          if-no-files-found: warn
  status:
    name: STATUS
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
    needs:
      - gitleaks
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show repository status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Repo: ${{ github.server_url }}/${{ github.repository }}'
          Write-Host 'Branch: ${{ github.ref_name }}'
          Write-Host 'Ref: ${{ github.ref }}'
          Write-Host 'SHA: ${{ github.sha }}'
          Write-Host 'Actor: ${{ github.actor }}'
          Write-Host 'Event: ${{ github.event_name }}'
      - name: Write summary table
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          'Secret Scan STATUS summary' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| Job | Result |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| --- | --- |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ('| gitleaks | ${{ needs.gitleaks.result }} |') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ('| Repo | ${{ github.server_url }}/${{ github.repository }} |') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ('| Branch | ${{ github.ref_name }} |') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: status-logs
          path: '*.log'
          retention-days: 7
          if-no-files-found: warn
